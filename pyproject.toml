# Rename to dev version
# This is dev version
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "Imervue"
version = "1.0.91"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
dependencies = [
    "PySide6==6.11.2", "qt-material", "Pillow>=12.3.0", "PyOpenGL", "numpy", "rawpy",
    "imageio", "imageio-ffmpeg", "PyOpenGL_accelerate", "defusedxml", "watchdog",
]
description = "GPU-accelerated image viewer with non-destructive develop, RAW/HDR/panorama support, AI upscale, XMP sidecars, and a plugin system."
keywords = [
    "image-viewer", "photo-viewer", "raw", "hdr", "panorama", "focus-stacking",
    "ai-upscale", "gpu", "opengl", "qt", "pyside6", "develop", "xmp", "lightroom",
]
requires-python = ">=3.10"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]

[project.urls]
Homepage = "https://github.com/JeffreyChen-s-Utils/Imervue"
Code = "https://github.com/JeffreyChen-s-Utils/Imervue"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages]
find = { namespaces = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "fast: isolated tests that do not construct Qt widgets or cross subsystem boundaries",
    "gui: tests that construct or interact with Qt widgets",
    "integration: tests that exercise multiple application subsystems or complete workflows",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# ``examples/`` is exempt — demo scripts live there and aren't part
# of the shipped package; tuning ruff for procedural-art helpers
# would just add noise without affecting production code.
extend-exclude = ["build", "dist", ".venv", "venv", "docs/_build", "examples"]
# ``/plugins/`` is gitignored (its files are force-added), so honouring
# .gitignore would silently skip the bundled plugins in ``ruff check .``.
respect-gitignore = false

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "UP",            # pyupgrade
    "PL",            # pylint
    "S",             # flake8-bandit (security)
    "C90",           # mccabe complexity
    "N",             # pep8-naming
    "BLE",           # flake8-blind-except
]
ignore = [
    # Qt override methods must be camelCase (mousePressEvent, paintEvent, ...)
    "N802", "N803", "N806", "N815",
    # Module/package name is the project brand "Imervue" — cannot be renamed
    "N999",
    # Local imports are often needed to break Qt circular imports
    "PLC0415",
    # Magic values are acceptable in UI constants (pixel sizes, timings)
    "PLR2004",
    # Non-crypto random is used for UI features (random image, annotation colours, IDs)
    "S311",
    # Lambdas wrapping signal slots are intentional — they drop the bool
    # ``checked`` argument that Qt ``triggered``/``toggled`` signals pass.
    "PLW0108",
    # Module-level caches (save-timer, bookmark set) genuinely need ``global``
    # for lazy init / invalidation.
    "PLW0602", "PLW0603",
    # subprocess is only used with static argument lists for trusted OS tools
    # (explorer, xdg-open, osascript, gsettings, pip inside frozen venv)
    "S603", "S607",
    # Plugin downloader only hits https:// URLs from a hard-coded allowlist
    "S310",
    # os.startfile / Popen without shell is intentional for "reveal in folder"
    "S606",
    # Function-shape limits: C901 caps complexity instead of branch / statement
    # counts. PLR0913 counts keyword-only options too; the project caps
    # positional parameters at 7 instead (tests/test_code_size_limits.py, see
    # CLAUDE.md for the keyword-only exception).
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
# McCabe ≤ 15 is the workspace-wide ceiling (D:\Codes\CLAUDE.md, "可讀性"),
# which a project may tighten but not relax. No module needs a per-file C901
# exemption.
mccabe.max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PLR0913", "PLR0915", "E501"]
"Imervue/multi_language/*.py" = ["E501"]
# Plugins ship their translations via get_translations(); long-localised
# strings (CJK + Korean) routinely exceed 100 chars and splitting them
# mid-character hurts readability.
"plugins/**/*.py" = ["E501"]
"Imervue/gpu_image_view/gl_renderer.py" = ["E501", "E702"]  # GLSL strings + glTexCoord/glVertex pairs
"Imervue/paint/canvas.py" = ["E702"]  # glTexCoord/glVertex pairs are clearer on one line
"Imervue/paint/canvas_overlays.py" = ["E702"]  # same glTexCoord/glVertex pairs, moved from canvas.py

[tool.bandit]
# Mirror of .bandit — kept here so tooling that only reads pyproject.toml picks
# it up. See .bandit for per-rule justification.
skips = ["B105", "B110", "B311", "B403", "B404", "B603", "B606", "B607"]
exclude_dirs = ["tests"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
