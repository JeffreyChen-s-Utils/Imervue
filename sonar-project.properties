# SonarCloud analysis configuration.
#
# Test code is held to a lighter bar than production code (the same stance the
# project already takes for bandit / Codacy, which exclude tests/**). The rules
# below fire only on test scaffolding — Qt-API method names on fake widgets
# (S100), exact float asserts (S1244), intentionally empty stub methods (S1186),
# fixture "password" literals (S2068), identity-passthrough `is` checks (S5796),
# throwaway unpacked locals (S1481), and a couple of test-only style rules — so
# they are ignored under tests/** rather than worked around in every test.
#
# t11-t15 cover assertion-style opinions that would cost 338 edits across a
# green 10,900-test suite for no behavioural gain, and would churn tests whose
# current shape is deliberate:
#
#   S5778 — one throwing call per pytest.raises block. Several tests assert that
#           a whole construct-then-invoke sequence raises, which is the contract
#           under test; splitting it would assert less than the test means to.
#   S9073 — split composite assertions. `assert a and b` reads fine when the two
#           halves are one fact (e.g. a returned pair).
#   S3415 — actual/expected argument order. Cosmetic under pytest, which prints
#           both sides on failure regardless of order.
#   S8997 — prefer the monkeypatch fixture. The flagged sites mutate module
#           globals the project's own autouse fixtures already isolate.
#   S5958 — narrower pytest.raises type. The flagged sites deliberately assert
#           only "this optional-dependency path fails", where the concrete
#           exception type varies by backend and is not part of the contract.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,t11,t12,t13,t14,t15

sonar.issue.ignore.multicriteria.t1.ruleKey=python:S100
sonar.issue.ignore.multicriteria.t1.resourceKey=tests/**

