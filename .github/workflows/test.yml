name: Tests

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff + bandit)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install linters
      # ruff matches uv.lock. Keep the pin: a newer ruff can promote rules to
      # stable (0.16 adds PLR0917) and turn an unchanged tree red.
      # Wheels only: an sdist would run its setup script on the runner.
      run: |
        python -m pip install --only-binary :all: "ruff==0.15.20" "bandit[toml]==1.9.4"
    - name: ruff
      run: python -m ruff check . --output-format=github
    - name: bandit
      # ``-c pyproject.toml`` is required, or bandit ignores the documented skips.
      run: python -m bandit -c pyproject.toml -r Imervue/ plugins/

  docs:
    runs-on: ubuntu-latest
    name: Docs (Sphinx, warnings are errors)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install Sphinx
      # The pins Read the Docs installs (docs/requirements.txt), named here so the job
      # installs exact versions; tests/test_workflow_actions.py keeps the two equal.
      run: |
        python -m pip install --only-binary :all: "sphinx==9.1.0" "sphinx-rtd-theme==3.1.0"
    - name: Build
      # ``-W`` turns every docutils / Sphinx warning into a failure, so a
      # translation that breaks inline markup next to CJK text is caught here.
      run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  fast:
    runs-on: windows-latest
    # ``experimental`` toggles continue-on-error so a Python release with
    # missing upstream wheels (PySide6, rawpy, etc.) does not block CI.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    name: Fast / Python ${{ matrix.python-version }}${{ matrix.experimental && ' (experimental)' || '' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install PySide6 Pillow PyOpenGL numpy rawpy imageio imageio-ffmpeg send2trash watchdog defusedxml pytest pytest-cov wgpu
    - name: Run fast tests
      # ``PYTHONFAULTHANDLER=1`` + ``-X faulthandler`` makes the
      # interpreter print a native traceback on SIGSEGV / fatal
      # signals — keep these on so any future teardown crash is
      # diagnosable rather than an opaque exit 1.
      # ``PYTHONUNBUFFERED=1`` keeps stdout / stderr live so the
      # crash trace actually reaches the GH Actions log before
      # the process dies.
      #
      # ``-p no:unraisableexception`` disables pytest's plugin
      # that calls ``gc_collect_harder()`` during
      # ``_ensure_unconfigure`` (i.e. AFTER every session fixture
      # has torn down). That explicit ``gc.collect`` walks the
      # full object graph and hits stale shiboken wrappers from
      # the thousands of QObjects this suite creates — segfault,
      # process killed, summary banner never flushed. The plugin
      # exists to surface exceptions raised inside ``__del__``;
      # in a PySide6-heavy suite those are unavoidable false
      # positives on shutdown, so disabling it on CI is the
      # right call.
      env:
        PYTHONFAULTHANDLER: "1"
        PYTHONUNBUFFERED: "1"
      run: python -X faulthandler -u -m pytest tests/ --test-layer=fast -v --tb=short -W ignore::DeprecationWarning -p no:unraisableexception

  extended:
    runs-on: windows-latest
    name: ${{ matrix.layer }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        layer: [gui, integration]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install PySide6 Pillow PyOpenGL numpy rawpy imageio imageio-ffmpeg send2trash watchdog defusedxml pytest pytest-cov wgpu
    - name: Run ${{ matrix.layer }} tests
      env:
        PYTHONFAULTHANDLER: "1"
        PYTHONUNBUFFERED: "1"
      run: python -X faulthandler -u -m pytest tests/ --test-layer=${{ matrix.layer }} -v --tb=short -W ignore::DeprecationWarning -p no:unraisableexception

  real-gl:
    runs-on: ubuntu-24.04
    name: Actual OpenGL / Linux Mesa / Python 3.12
    timeout-minutes: 15
    env:
      # Windows retains its offscreen crash guard. This independent X server
      # uses actual Mesa contexts; a skipped or missing GL case fails the job.
      CI: "false"
      QT_QPA_PLATFORM: xcb
      QT_XCB_GL_INTEGRATION: xcb_glx
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install X server and Mesa
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libegl1 libopengl0 \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-render-util0 libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0
    - name: Install core test dependencies
      run: >-
        python -m pip install --only-binary :all:
        PySide6 Pillow PyOpenGL numpy rawpy imageio send2trash watchdog defusedxml pytest
    - name: Record actual GL capability
      run: xvfb-run -a glxinfo -B
    - name: Run real rendering and workspace lifecycle regressions
      run: >-
        xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX"
        python -X faulthandler -u -m pytest
        tests/test_tile_textures_gl.py tests/test_workspace_lifecycle_gl.py
        tests/test_paint_auto_save.py::test_background_dirty_tab_and_multiple_document_recovery
        tests/test_main_window_layout.py::test_returning_to_paint_keeps_edited_layers_dirty_state_and_undo
        -v --tb=short -o junit_family=xunit1 --junitxml=real-gl.xml
        -p no:unraisableexception
    - name: Require executed GL cases and renderer evidence
      run: python scripts/verify_gl_report.py real-gl.xml
    - name: Keep actual GL results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: real-gl-linux-python312
        path: real-gl.xml
        retention-days: 7

  publish-dev:
    # The dev channel. A push to dev that passes every job above is built from dev.toml and
    # uploaded when it is still the tip of dev and ships something the newest Imervue_dev does
    # not. scripts/dev_release.py picks the version from PyPI, so nothing is committed back.
    # This workflow also runs for main and for pull requests: the condition keeps both out.
    name: Publish Imervue_dev to PyPI
    needs: [lint, docs, fast, extended, real-gl]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-dev
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install build tooling
      # This job holds the PyPI token, so it installs one file and nothing else:
      # build, twine and the build backend, wheels only, at locked hashes. The
      # release job of release.yml installs the same file. The command that
      # regenerates it is at the top of .github/requirements/publish.in.
      run: |
        python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt
    - name: Write pyproject.toml from dev.toml with the next version
      run: python scripts/dev_release.py prepare
    - name: Build sdist and wheel
      # --no-isolation: the backend is the setuptools locked in publish.txt, not
      # a fresh download. Building does not import the package, so PySide6 is
      # not installed here.
      run: python -m build --no-isolation
    - name: Verify distribution metadata
      run: python -m twine check dist/*
    - name: Compare with the newest published wheel
      id: compare
      run: python scripts/dev_release.py changed dist
    - name: Check that this commit is still the tip of dev
      # A run that finishes after a newer push would otherwise publish older
      # code as the newest release.
      id: tip
      run: |
        tip="$(git ls-remote origin refs/heads/dev | cut -f1)"
        if [ "$tip" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
        echo "current=$current" >> "$GITHUB_OUTPUT"
    - name: Publish to PyPI
      if: steps.compare.outputs.changed == 'true' && steps.tip.outputs.current == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload --non-interactive dist/*
