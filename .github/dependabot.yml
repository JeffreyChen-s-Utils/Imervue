# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    # Location of package manifests: the project's own at the root, and the
    # hash-locked tooling of the jobs that hold the PyPI token (publish.in and
    # publish.txt). Dependabot does not look that deep from the root, so the
    # directory is named.
    directories:
      - "/"
      - "/.github/requirements"
    schedule:
      interval: "daily"
    # Development work, dependency bumps included, goes to dev; main takes
    # releases only, and every push to main runs the release workflow.
    target-branch: "dev"
  # Workflow actions are pinned to commit SHAs with the version as a comment
  # (tests/test_workflow_actions.py); Dependabot moves both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
